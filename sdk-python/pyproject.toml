[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "veriport"
version = "0.1.0"
description = "Client for the Veriport API: EU VAT number validation on VIES with a dated cache, EU VAT rates dated and sourced, IBAN validation from the SWIFT registry, French company data by SIREN/SIRET. Offline helpers (VAT number structure, IBAN mod-97) included."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Janolab Studio LLC", email = "hello@veriport.io" }]
keywords = ["vat", "vies", "vat-validation", "iban", "iban-validation", "mod97", "sepa", "vat-rates", "siren", "siret", "eu-vat"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["httpx>=0.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://veriport.io"
Documentation = "https://veriport.io/docs"
OpenAPI = "https://veriport.io/openapi.json"
Changelog = "https://veriport.io/changelog"

[tool.hatch.build.targets.wheel]
packages = ["src/veriport"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
